<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio Milton Gamboa - IA & Estadística</title>
    
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker listo'))
            .catch(err => console.log('Error en SW', err));
        });
      }
    </script>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/show-hint.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/show-hint.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #1e1e1e; overflow: hidden; }
        header { background: linear-gradient(135deg, #1a2a6c 0%, #b21f1f 50%, #fdbb2d 100%); color: white; padding: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.6); z-index: 10; }
        header h1 { margin: 0; font-size: 1.3rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; }
        header p { margin: 3px 0 0; font-size: 0.85rem; color: #ffffff; opacity: 0.9; }
        #status { font-size: 11px; background: #f1c40f; padding: 4px; text-align: center; font-weight: bold; color: #000; text-transform: uppercase; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .panel-editor { display: flex; flex-direction: column; width: 50%; border-right: 2px solid #333; background: #282a36; }
        .CodeMirror { flex: 1; font-size: 16px; height: auto !important; border-bottom: 1px solid #444; }
        .CodeMirror-hints { background: #2c3e50 !important; color: white !important; z-index: 1000; }
        .controls-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #111; gap: 8px; }
        #run-btn { flex: 1; background: #27ae60; color: white; border: none; padding: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase; font-size: 13px; box-shadow: 0 4px 0 #1e8449; }
        #run-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #1e8449; }
        #run-btn:disabled { background: #7f8c8d; opacity: 0.6; }
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background: #34495e; color: white; padding: 12px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .dropdown-content { display: none; position: absolute; bottom: 55px; right: 0; background-color: #2c3e50; min-width: 220px; box-shadow: 0px -8px 25px rgba(0,0,0,0.6); z-index: 100; border-radius: 8px; border: 1px solid #444; }
        .dropdown-content button { color: #ecf0f1; padding: 14px 18px; display: block; width: 100%; border: none; background: none; text-align: left; cursor: pointer; font-size: 12px; text-transform: uppercase; border-bottom: 1px solid #3e4f5f; }
        .show { display: block; }
        .panel-output { width: 50%; background: #fdfdfd; display: flex; flex-direction: column; overflow-y: auto; }
        .output-header { background: #eee; padding: 8px 15px; font-size: 10px; color: #888; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #ddd; }
        #text-output { padding: 20px; font-family: 'Consolas', monospace; font-size: 13px; color: #2c3e50; white-space: pre-wrap; line-height: 1.6; }
        #plot-container img { max-width: 100%; height: auto; border-radius: 10px; margin-top: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border: 1px solid #ddd; }
        @media (max-width: 768px) { .main-container { flex-direction: column; } .panel-editor, .panel-output { width: 100%; } .CodeMirror { height: 350px !important; } .dropdown-content { bottom: auto; top: 55px; } }
    </style>
</head>
<body>

<header>
    <h1>MILTON GAMBOA</h1>
    <p>Estadística & Machine Learning</p>
</header>
<div id="status">Cargando motor de Python...</div>

<div class="main-container">
    <div class="panel-editor">
        <textarea id="editor"></textarea>
        <div class="controls-bar">
            <button id="run-btn" disabled onclick="runLab()">▶ Ejecutar Laboratorio</button>
            <div class="dropdown">
                <button class="dropbtn" onclick="toggleMenu()">⋮</button>
                <div id="myDropdown" class="dropdown-content">
                    <button onclick="document.getElementById('file-upload-data').click()">📊 Cargar Datos (CSV/Excel)</button>
                    <button onclick="document.getElementById('file-upload-py').click()">🐍 Cargar Script .PY</button>
                    <button onclick="saveLocal()">💾 Guardar Local</button>
                    <button onclick="downloadCode()">📥 Exportar .PY</button>
                    <button onclick="clearConsole()" style="color: #ff7675;">🗑 Limpiar Consola</button>
                </div>
            </div>
            <input type="file" id="file-upload-data" accept=".csv, .xlsx" style="display: none;">
            <input type="file" id="file-upload-py" accept=".py" style="display: none;">
        </div>
    </div>
    <div class="panel-output" id="out-panel">
        <div class="output-header">Consola de Resultados</div>
        <div id="text-output">Preparando entorno...</div>
        <div id="plot-container" style="padding:0 20px;"></div>
    </div>
</div>

<script>
    const miltonDictionary = ["numpy", "pandas", "plt", "sns", "read_csv", "shapiro", "mean", "std", "input", "print", "LinearRegression", "train_test_split"].sort();

    function miltonHint(editor) {
        const cursor = editor.getCursor();
        const line = editor.getLine(cursor.line);
        const start = cursor.ch;
        let wordStart = start;
        while (wordStart > 0 && /[\w]/.test(line.charAt(wordStart - 1))) wordStart--;
        const currentWord = line.slice(wordStart, start);
        const list = miltonDictionary.filter(word => word.startsWith(currentWord.toLowerCase()));
        return { list: list, from: CodeMirror.Pos(cursor.line, wordStart), to: CodeMirror.Pos(cursor.line, start) };
    }

    const editorInstance = CodeMirror.fromTextArea(document.getElementById("editor"), {
        mode: "python", theme: "dracula", lineNumbers: true, matchBrackets: true,
        autoCloseBrackets: true, indentUnit: 4, inputStyle: "contenteditable"
    });

    // AUTO-RECUPERACIÓN: Cargar al iniciar
    window.addEventListener('DOMContentLoaded', () => {
        const saved = localStorage.getItem('milton_autosave');
        if (saved) editorInstance.setValue(saved);
    });

    // AUTO-GUARDADO: Guardar mientras escribe
    editorInstance.on("change", () => {
        localStorage.setItem('milton_autosave', editorInstance.getValue());
    });

    editorInstance.on("inputRead", function(cm, change) {
        if (change.text[0].match(/[a-z]/i)) cm.showHint({ hint: miltonHint, completeSingle: false });
    });
// AUTO-GUARDADO AUTOMÁTICO cada 2 segundos
let autoSaveTimer;
editorInstance.on("change", function() {
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(() => {
        localStorage.setItem('milton_lab_save', editorInstance.getValue());
        console.log('✅ Código auto-guardado');
    }, 2000); // Espera 2 segundos después del último cambio
});
    // CARGAR ARCHIVO .PY
    document.getElementById('file-upload-py').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => { editorInstance.setValue(ev.target.result); toggleMenu(); };
        reader.readAsText(file);
    };

    // CARGAR DATOS (CSV/EXCEL)
    document.getElementById('file-upload-data').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file || !pyodide) return;
        const data = new Uint8Array(await file.arrayBuffer());
        pyodide.FS.writeFile(file.name, data);
        document.getElementById("text-output").innerText = `✅ DATOS LISTOS: "${file.name}"`;
    };

    function toggleMenu() { document.getElementById("myDropdown").classList.toggle("show"); }
    window.onclick = (e) => { if (!e.target.matches('.dropbtn')) { 
        document.querySelectorAll('.dropdown-content').forEach(d => d.classList.remove('show')); 
    }};

    function saveLocal() { localStorage.setItem('milton_autosave', editorInstance.getValue()); alert("¡Guardado!"); }
    function clearConsole() { document.getElementById("text-output").innerText = ""; document.getElementById("plot-container").innerHTML = ""; }
    function downloadCode() {
        const blob = new Blob([editorInstance.getValue()], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'laboratorio_milton.py';
        a.click();
    }

    let pyodide;
    async function initPython() {
        try {
            pyodide = await loadPyodide();
            await pyodide.loadPackage(["numpy", "pandas", "scipy", "matplotlib", "scikit-learn"]);
            pyodide.runPython("import builtins, js\nbuiltins.input = lambda p='': js.prompt(p)");
            document.getElementById("status").innerText = "✅ SISTEMA LISTO";
            document.getElementById("status").style.background = "#27ae60";
            document.getElementById("run-btn").disabled = false;
            document.getElementById("text-output").innerText = "Listo para trabajar.";
        } catch (e) { document.getElementById("status").innerText = "❌ ERROR DE CARGA"; }
    }

    async function runLab() {
        const out = document.getElementById("text-output");
        const plot = document.getElementById("plot-container");
        out.innerText = ">>> Procesando...";
        plot.innerHTML = "";
        try {
            await pyodide.runPythonAsync(`
import sys, io, matplotlib.pyplot as plt, base64
plt.switch_backend('Agg')
sys.stdout = io.StringIO()
            `);
            await pyodide.runPythonAsync(editorInstance.getValue());
            out.innerText = pyodide.runPython("sys.stdout.getvalue()") || "Ejecución finalizada.";
            
            const plotData = pyodide.runPython(`
if plt.get_fignums():
    buf = io.BytesIO()
    plt.savefig(buf, format='png', bbox_inches='tight')
    img = base64.b64encode(buf.getvalue()).decode('utf-8')
    plt.clf()
    img
else: None
            `);
            if (plotData) {
                const img = document.createElement("img");
                img.src = "data:image/png;base64," + plotData;
                plot.appendChild(img);
            }
        } catch (err) { out.innerText = "❌ ERROR:\n" + err; }
        document.getElementById("run-btn").disabled = false;
    }
    initPython();
</script>
</body>
</html>
