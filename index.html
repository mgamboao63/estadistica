<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio Milton Gamboa - IA & Estadística</title>
    
    <link rel="manifest" href="manifest.json">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker listo'))
            .catch(err => console.log('Error en SW', err));
        });
      }
    </script>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/show-hint.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/show-hint.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #1e1e1e; overflow: hidden; }
        header { background: linear-gradient(135deg, #1a2a6c 0%, #b21f1f 50%, #fdbb2d 100%); color: white; padding: 12px; text-align: center; }
        header h1 { margin: 0; font-size: 1.3rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; }
        header p { margin: 3px 0 0; font-size: 0.85rem; }
        #status { font-size: 11px; background: #f1c40f; padding: 4px; text-align: center; font-weight: bold; color: #000; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .panel-editor { display: flex; flex-direction: column; width: 50%; border-right: 2px solid #333; background: #282a36; }
        .CodeMirror { flex: 1; font-size: 16px; }
        .controls-bar { display: flex; padding: 10px; background: #111; gap: 8px; }
        #run-btn { flex: 1; background: #27ae60; color: white; border: none; padding: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .panel-output { width: 50%; background: #fff; display: flex; flex-direction: column; overflow-y: auto; }
        #text-output { padding: 20px; font-family: monospace; }
        #plot-container img { max-width: 100%; margin-top: 15px; border-radius: 10px; }
    </style>
</head>

<body>

<header>
    <h1>MILTON GAMBOA</h1>
    <p>Estadística & Machine Learning</p>
</header>

<div id="status">Cargando Python...</div>

<div class="main-container">
    <div class="panel-editor">
        <textarea id="editor"></textarea>
        <div class="controls-bar">
            <button id="run-btn" disabled onclick="runLab()">▶ Ejecutar</button>
        </div>
    </div>

    <div class="panel-output">
        <div id="text-output">Preparando entorno...</div>
        <div id="plot-container"></div>
    </div>
</div>

<script>
    let editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
        mode: "python",
        theme: "dracula",
        lineNumbers: true
    });

    let pyodide;

    async function initPython() {
        pyodide = await loadPyodide();
        await pyodide.loadPackage(["numpy", "matplotlib"]);
        document.getElementById("status").innerText = "✅ Listo";
        document.getElementById("run-btn").disabled = false;
    }

    async function runLab() {
        const out = document.getElementById("text-output");
        const plot = document.getElementById("plot-container");

        out.innerText = ">>> Ejecutando...";
        plot.innerHTML = "";

        try {
            await pyodide.runPythonAsync(`
import sys, io, matplotlib.pyplot as plt, base64
plt.switch_backend('Agg')
sys.stdout = io.StringIO()
            `);

            await pyodide.runPythonAsync(editor.getValue());

            out.innerText = pyodide.runPython("sys.stdout.getvalue()") || "Listo";

            const images = pyodide.runPython(`
import io, base64
imgs = []

for n in plt.get_fignums():
    fig = plt.figure(n)
    buf = io.BytesIO()
    fig.savefig(buf, format='png', bbox_inches='tight')
    buf.seek(0)
    imgs.append(base64.b64encode(buf.read()).decode('utf-8'))

plt.close('all')
imgs
            `);

            if (images.length > 0) {
                images.forEach(imgData => {
                    let img = document.createElement("img");
                    img.src = "data:image/png;base64," + imgData;
                    plot.appendChild(img);
                });
            }

        } catch (err) {
            out.innerText = "❌ ERROR:\n" + err;
        }
    }

    initPython();
</script>

</body>
</html>
